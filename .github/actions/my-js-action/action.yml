name: 'Hello World Custom Action'
description: 'Greets someone and records the time'
inputs:
  who-to-greet:
    description: 'Who we are greeting'
    required: true
    default: 'World'
outputs:
  greeting_time:
    description: 'The time we greeted them'
runs:
  using: 'node20'
  main: 'dist/index.js'